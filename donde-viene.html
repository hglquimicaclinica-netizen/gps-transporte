<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0">
<meta property="og:title" content="¿Dónde viene el camión? · Ruta 57 Huala-Provi">
<meta property="og:description" content="Ve en tiempo real por dónde viene el camión de la Ruta 57 Hualahuises-Linares.">
<title>¿Dónde viene el camión? · Ruta 57</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&display=swap');

  :root {
    --verde: #059669;
    --morado: #7c3aed;
    --rojo: #dc2626;
    --azul: #2563eb;
    --fondo: #f8fafc;
    --borde: #e2e8f0;
    --texto: #1e293b;
    --gris: #64748b;
    --gris-claro: #f1f5f9;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height: 100%;
    font-family: 'DM Sans', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    overflow: hidden; /* sin scroll en body, todo en columna flex */
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh; /* dynamic viewport height - funciona bien en móvil */
  }

  /* ── HEADER ── */
  header {
    background: #fff;
    border-bottom: 2px solid var(--borde);
    padding: 10px 14px 8px;
    text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    flex-shrink: 0;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 6px;
  }

  .bus-emoji { font-size: 30px; line-height: 1; }

  .titulo-grande {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 2px;
    color: var(--texto);
    line-height: 1;
  }

  .subtitulo { font-size: 12px; color: var(--gris); line-height: 1; }

  .live-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 4px;
  }

  .live-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #dcfce7;
    border: 1.5px solid #86efac;
    color: #15803d;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.5px;
  }

  .live-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #16a34a;
    animation: blink 1.5s ease infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  .hora-pill {
    font-size: 11px;
    color: var(--gris);
    background: var(--gris-claro);
    padding: 4px 10px;
    border-radius: 20px;
    font-weight: 600;
  }

  /* ── BANNER AVISO ── */
  .banner-aviso {
    display: none;
    background: #fef9c3;
    border-bottom: 1px solid #fde047;
    padding: 8px 14px;
    text-align: center;
    font-size: 13px;
    color: #854d0e;
    font-weight: 600;
    flex-shrink: 0;
  }
  .banner-aviso.visible { display: block; }

  /* ── TARJETAS UNIDADES ── */
  .unidades-row {
    display: flex;
    gap: 8px;
    padding: 10px 12px 8px;
    background: #fff;
    border-bottom: 1px solid var(--borde);
    overflow-x: auto;
    flex-shrink: 0;
    -webkit-overflow-scrolling: touch;
  }

  .unidades-row::-webkit-scrollbar { display: none; }

  .unidad-pill {
    flex: 1;
    min-width: 130px;
    border-radius: 12px;
    padding: 10px 12px;
    border: 2px solid var(--borde);
    background: var(--fondo);
    cursor: pointer;
    transition: transform 0.15s;
    text-align: center;
    -webkit-tap-highlight-color: transparent;
  }

  .unidad-pill:active { transform: scale(0.96); }

  .up-bus { font-size: 22px; display: block; margin-bottom: 2px; }
  .up-nombre { font-family:'Bebas Neue',sans-serif; font-size:14px; letter-spacing:1.5px; }
  .up-estado { font-size: 11px; margin-top: 3px; font-weight: 700; }
  .up-estado.en-ruta { color: var(--verde); }
  .up-estado.sin-senal { color: var(--gris); }
  .up-estado.averia { color: var(--rojo); }
  .up-direccion { font-size: 10px; color: var(--gris); margin-top: 2px; line-height: 1.3; }

  /* ── MAPA — ocupa todo el espacio restante ── */
  #mapa {
    flex: 1;
    min-height: 0; /* importante para flex en móvil */
    z-index: 1;
  }

  /* ── PARADAS en la parte inferior ── */
  .paradas-bar {
    background: #fff;
    border-top: 1px solid var(--borde);
    padding: 8px 12px 10px;
    flex-shrink: 0;
  }

  .paradas-label {
    font-size: 10px;
    color: var(--gris);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight: 700;
  }

  .paradas-scroll {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 2px;
  }

  .paradas-scroll::-webkit-scrollbar { display: none; }

  .parada-chip {
    flex-shrink: 0;
    background: var(--gris-claro);
    border: 1px solid var(--borde);
    border-radius: 20px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--texto);
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    transition: all 0.15s;
  }

  .parada-chip:active { background: #dbeafe; border-color: #93c5fd; color: var(--azul); }

  /* Popup */
  .leaflet-popup-content-wrapper {
    background: #fff !important;
    border: 2px solid var(--borde) !important;
    color: var(--texto) !important;
    border-radius: 12px !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important;
    font-family: 'DM Sans', sans-serif !important;
  }
  .leaflet-popup-tip { background: #fff !important; }
  .leaflet-popup-content { margin: 10px 14px !important; font-size: 13px !important; line-height: 1.6 !important; }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <div class="header-inner">
      <div class="bus-emoji">🚌</div>
      <div>
        <div class="titulo-grande">RUTA 57 · HUALA-PROVI</div>
        <div class="subtitulo">Hualahuises — Linares</div>
      </div>
    </div>
    <div class="live-row">
      <div class="live-pill"><div class="live-dot"></div>EN VIVO</div>
      <div class="hora-pill" id="horaActual">--:--</div>
    </div>
  </header>

  <!-- AVISO SIN SEÑAL -->
  <div class="banner-aviso" id="bannerSinSenal">
    ⚠️ El camión no está enviando señal. Intenta de nuevo en unos minutos.
  </div>

  <!-- TARJETAS UNIDADES -->
  <div class="unidades-row" id="unidadesRow">
    <div style="flex:1;text-align:center;padding:12px;color:#64748b;font-size:13px">
      Buscando camiones...</div>
  </div>

  <!-- MAPA -->
  <div id="mapa"></div>

  <!-- PARADAS -->
  <div class="paradas-bar">
    <div class="paradas-label">📍 Paradas de la ruta</div>
    <div class="paradas-scroll" id="paradasScroll"></div>
  </div>

</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHKnO-UMZ9GywKojn4t70AMRmvARQnzeXHnjKxJPGEmU9xZeQ6lUxYN9kuDYQjGr_uyQ/exec";

// Límites mapa — solo Linares y Hualahuises
const LIMITES = L.latLngBounds([24.840, -99.720], [24.910, -99.530]);

const mapa = L.map('mapa', {
  zoomControl: true,
  minZoom: 12,
  maxZoom: 18,
  maxBounds: LIMITES,
  maxBoundsViscosity: 1.0,
  tap: true // mejor respuesta táctil en iOS
}).setView([24.872, -99.620], 13);

// Mapa blanco claro
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap © CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(mapa);

// ── PARADAS CON COORDENADAS EXACTAS ──
const PARADAS = [
  { lat: 24.8846,    lng: -99.6737,   icon: '🏛️', nombre: 'Plaza Hualahuises',       sub: 'Inicio de ruta' },
  { lat: 24.878,     lng: -99.665,    icon: '🌵', nombre: 'La Magueyada',             sub: '' },
  { lat: 24.872,     lng: -99.650,    icon: '⚾', nombre: 'Béisbol Santa Rosa',       sub: '' },
  { lat: 24.869,     lng: -99.632,    icon: '🏘️', nombre: 'Col. Camachito',           sub: '' },
  { lat: 24.8633,    lng: -99.5981,   icon: '🎓', nombre: 'UT Linares',               sub: 'Universidad Tecnológica' },
  { lat: 24.864772,  lng: -99.572858, icon: '⚾', nombre: 'Parque Béisbol A.L.M.',    sub: 'Adolfo López Mateos' },
  { lat: 24.865681,  lng: -99.572596, icon: '🏪', nombre: 'Waldos',                   sub: '' },
  { lat: 24.866147,  lng: -99.572506, icon: '⛪', nombre: 'La Misión Díaz-Ordaz',     sub: 'Pablo Salce' },
  { lat: 24.863879,  lng: -99.573221, icon: '🚉', nombre: 'Central Autobuses',        sub: 'Linares' },
  { lat: 24.863682,  lng: -99.568537, icon: '🛒', nombre: 'Bodega Aurrera',           sub: '' },
  { lat: 24.863552,  lng: -99.570091, icon: '🌮', nombre: 'Tacos Cuéllar',            sub: 'Independencia' },
  { lat: 24.863552,  lng: -99.570091, icon: '🏬', nombre: 'Plaza La Alameda',         sub: 'Centro Linares' },
  { lat: 24.860400,  lng: -99.569859, icon: '🎓', nombre: 'Prepa #4',                 sub: 'Benito Juárez' },
  { lat: 24.859929,  lng: -99.568395, icon: '🏛️', nombre: 'Plaza Principal Linares', sub: 'Hidalgo 100' },
  { lat: 24.859487,  lng: -99.566585, icon: '🧵', nombre: 'Parisina',                 sub: 'Benito Juárez 208' },
  { lat: 24.859183,  lng: -99.565442, icon: '🌳', nombre: 'Plaza Juárez',             sub: 'Centro Linares' },
  { lat: 24.858142,  lng: -99.561951, icon: '⛪', nombre: 'La Misión Villegas',       sub: 'Benito Juárez 901' },
  { lat: 24.857735,  lng: -99.560421, icon: '🏪', nombre: 'Oxxo Villegas',            sub: '' },
  { lat: 24.858522,  lng: -99.560001, icon: '🛋️', nombre: 'Mueblería Marysol',       sub: 'Villegas' },
  { lat: 24.857367,  lng: -99.552691, icon: '🌉', nombre: 'Puente Negro',             sub: 'Av. Álamo 1412' },
  { lat: 24.859527,  lng: -99.550224, icon: '🏪', nombre: 'Plaza Provileon',          sub: '' },
  { lat: 24.860846,  lng: -99.547177, icon: '🏠', nombre: 'Fovissste',                sub: 'Provileon' },
  { lat: 24.861253,  lng: -99.548363, icon: '🏥', nombre: 'Hospital General',         sub: 'SSNL · Av. Álamo' },
];

// Poner paradas en el mapa
PARADAS.forEach(p => {
  L.marker([p.lat, p.lng], {
    icon: L.divIcon({
      className: '',
      html: `<div style="
        background:#fff;border:1.5px solid #cbd5e1;border-radius:7px;
        padding:2px 6px;font-size:10px;color:#334155;white-space:nowrap;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);display:flex;align-items:center;gap:3px;
      ">${p.icon} <span>${p.nombre}</span></div>`,
      iconAnchor: [0, 0]
    })
  }).addTo(mapa)
    .bindPopup(`<b>${p.icon} ${p.nombre}</b>${p.sub ? '<br><span style="color:#64748b;font-size:11px">'+p.sub+'</span>' : ''}`);
});

// Chips de paradas en la barra inferior
const scrollEl = document.getElementById('paradasScroll');
PARADAS.forEach(p => {
  const chip = document.createElement('div');
  chip.className = 'parada-chip';
  chip.textContent = `${p.icon} ${p.nombre}`;
  chip.onclick = () => mapa.flyTo([p.lat, p.lng], 17, { duration: 0.8 });
  scrollEl.appendChild(chip);
});

// ── ÍCONO CAMIÓN ──
const COLORES = {
  1: { bg:'#7c3aed', bd:'#a78bfa' },
  2: { bg:'#059669', bd:'#34d399' },
  3: { bg:'#d97706', bd:'#fbbf24' },
  4: { bg:'#dc2626', bd:'#f87171' },
  5: { bg:'#0284c7', bd:'#38bdf8' },
};

function iconoCamion(num, averiado) {
  const c = COLORES[num] || COLORES[1];
  return L.divIcon({
    className: '',
    html: `<div style="
      background:${c.bg};border:3px solid ${c.bd};border-radius:12px;
      padding:5px 8px;box-shadow:0 0 0 3px ${c.bg}44,0 4px 14px rgba(0,0,0,0.25);
      display:flex;flex-direction:column;align-items:center;gap:1px;
      min-width:46px;text-align:center;
    ">
      <span style="font-size:20px">${averiado ? '🔴' : '🚌'}</span>
      <span style="font-size:9px;font-weight:800;color:#fff;letter-spacing:1px;font-family:sans-serif">U${num}</span>
    </div>`,
    iconSize: [52, 52],
    iconAnchor: [26, 26],
    popupAnchor: [0, -30]
  });
}

function detectarDireccion(lng) {
  return lng < -99.615 ? '➡️ Va hacia Linares' : '⬅️ Va hacia Hualahuises';
}

let marcadores = {};
let datosActivos = {};
let ultimaActualizacion = {};

function renderUnidades(json) {
  const row = document.getElementById('unidadesRow');
  const unidades = [];
  for (let i = 1; i <= 5; i++) {
    if (json[`u${i}`]) unidades.push({ num: i, info: json[`u${i}`] });
  }

  if (unidades.length === 0) {
    row.innerHTML = `<div style="flex:1;text-align:center;padding:12px;color:#64748b;font-size:13px">
      Sin camiones en línea ahora mismo</div>`;
    return;
  }

  const c = COLORES;
  row.innerHTML = unidades.map(u => {
    const av = u.info.averia == '1';
    const dir = detectarDireccion(parseFloat(u.info.lng));
    const col = c[u.num] || c[1];
    return `<div class="unidad-pill" onclick="centrar(${u.num})"
      style="border-color:${col.bd};background:${col.bg}11">
      <span class="up-bus">${av ? '🔴' : '🚌'}</span>
      <div class="up-nombre" style="color:${col.bg}">Unidad ${u.num}</div>
      <div class="up-estado ${av ? 'averia' : 'en-ruta'}">${av ? '⚠️ Avería' : '● En ruta'}</div>
      <div class="up-direccion">${dir}</div>
    </div>`;
  }).join('');
}

async function cargarDatos() {
  try {
    const res = await fetch(`${SCRIPT_URL}?action=get&t=${Date.now()}`);
    const json = await res.json();

    const ahora = Date.now();
    const TIMEOUT_MS = 5 * 60 * 1000; // 5 minutos sin señal = desconectado

    // Procesar cada unidad
    for (let i = 1; i <= 5; i++) {
      const key = `u${i}`;
      if (json[key]) {
        // Unidad con datos frescos
        const info = json[key];
        const lat = parseFloat(info.lat);
        const lng = parseFloat(info.lng);
        const av = info.averia == '1';
        const dir = detectarDireccion(lng);

        datosActivos[i] = { lat, lng };
        ultimaActualizacion[i] = ahora;

        const popup = `<b style="font-size:14px">🚌 Unidad ${i}</b><br>
          ${av ? '<b style="color:#dc2626">⚠️ AVERÍA REPORTADA</b><br>' : ''}
          <span style="color:#059669;font-weight:700">${dir}</span><br>
          <span style="color:#64748b;font-size:11px">Actualizado: ${info.timestamp || '--'}</span>`;

        const icono = iconoCamion(i, av);
        if (!marcadores[i]) {
          marcadores[i] = L.marker([lat, lng], { icon: icono }).addTo(mapa).bindPopup(popup);
        } else {
          marcadores[i].setLatLng([lat, lng]);
          marcadores[i].setIcon(icono);
          marcadores[i].setPopupContent(popup);
        }

      } else if (marcadores[i]) {
        // No hay datos de esta unidad — verificar si ya expiró
        const ultima = ultimaActualizacion[i] || 0;
        if (ahora - ultima > TIMEOUT_MS) {
          // Quitar del mapa
          mapa.removeLayer(marcadores[i]);
          delete marcadores[i];
          delete datosActivos[i];
        }
      }
    }

    // Mostrar solo unidades activas en las tarjetas
    const jsonFiltrado = {};
    for (let i = 1; i <= 5; i++) {
      if (datosActivos[i]) jsonFiltrado[`u${i}`] = json[`u${i}`] || {};
    }
    renderUnidades(jsonFiltrado);

    const haySinSenal = Object.keys(datosActivos).length === 0;
    document.getElementById('bannerSinSenal').classList.toggle('visible', haySinSenal);

  } catch(e) {
    document.getElementById('bannerSinSenal').classList.add('visible');
  }
}

function centrar(num) {
  const d = datosActivos[num];
  if (d) mapa.flyTo([d.lat, d.lng], 16, { duration: 0.8 });
}

// Reloj
setInterval(() => {
  document.getElementById('horaActual').textContent =
    new Date().toLocaleTimeString('es-MX', { hour:'2-digit', minute:'2-digit' });
}, 1000);

cargarDatos();
setInterval(cargarDatos, 15000);
</script>
</body>
</html>
