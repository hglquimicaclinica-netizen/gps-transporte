<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0A0A0F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GPS Chofer">
<link rel="manifest" href="manifest.json">
<title>GPS Chofer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600&display=swap');

  :root {
    --verde: #00E676;
    --verde-dark: #00C853;
    --rojo: #FF1744;
    --amarillo: #FFD600;
    --fondo: #0A0A0F;
    --card: #12121A;
    --borde: #1E1E2E;
    --texto: #E8E8F0;
    --gris: #666688;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--fondo);
    color: var(--texto);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(ellipse at 60% 40%, rgba(0,230,118,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .unidad-selector {
    display: flex;
    gap: 12px;
    margin-bottom: 24px;
  }

  .btn-unidad {
    flex: 1;
    padding: 12px 24px;
    border-radius: 12px;
    border: 2px solid var(--borde);
    background: var(--card);
    color: var(--gris);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-unidad.activo {
    border-color: var(--verde);
    color: var(--verde);
    background: rgba(0,230,118,0.08);
  }

  .tarjeta {
    background: var(--card);
    border: 1px solid var(--borde);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 340px;
    text-align: center;
  }

  .titulo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 3px;
    margin-bottom: 2px;
  }

  .subtitulo {
    font-size: 12px;
    color: var(--gris);
    margin-bottom: 28px;
    letter-spacing: 0.5px;
  }

  /* Botón GPS */
  .btn-gps {
    width: 170px;
    height: 170px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    margin: 0 auto 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 35%, #1a3a2a, #0d1f15);
    box-shadow: 0 0 0 3px rgba(0,230,118,0.2), 0 0 0 8px rgba(0,230,118,0.06), 0 8px 40px rgba(0,0,0,0.6);
    transition: transform 0.15s, box-shadow 0.15s;
    outline: none;
    gap: 4px;
  }

  .btn-gps:active { transform: scale(0.94); }

  .btn-gps.activo {
    background: radial-gradient(circle at 35% 35%, #1a3a2a, #0d2a1a);
    box-shadow: 0 0 0 4px rgba(0,230,118,0.5), 0 0 0 12px rgba(0,230,118,0.1), 0 8px 40px rgba(0,0,0,0.6);
    animation: pulsar 2s ease-in-out infinite;
  }

  .btn-gps.activo .icono-gps { filter: drop-shadow(0 0 16px rgba(0,230,118,0.8)); }

  @keyframes pulsar {
    0%, 100% { box-shadow: 0 0 0 4px rgba(0,230,118,0.5), 0 0 0 12px rgba(0,230,118,0.1), 0 8px 40px rgba(0,0,0,0.6); }
    50% { box-shadow: 0 0 0 6px rgba(0,230,118,0.4), 0 0 0 20px rgba(0,230,118,0.05), 0 8px 40px rgba(0,0,0,0.6); }
  }

  .icono-gps { font-size: 58px; filter: drop-shadow(0 0 10px rgba(0,230,118,0.4)); }

  .btn-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--verde);
    opacity: 0.8;
  }

  /* Banner de estado del rastreo */
  .banner-rastreo {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    border-radius: 12px;
    margin-bottom: 20px;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.3s;
    background: rgba(255,214,0,0.08);
    border: 1px solid rgba(255,214,0,0.2);
    color: var(--amarillo);
  }

  .banner-rastreo.activo {
    background: rgba(0,230,118,0.08);
    border-color: rgba(0,230,118,0.3);
    color: var(--verde);
  }

  .banner-rastreo.error {
    background: rgba(255,23,68,0.08);
    border-color: rgba(255,23,68,0.3);
    color: var(--rojo);
  }

  .banner-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .banner-rastreo.activo .banner-dot { animation: blink 1.5s ease infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

  /* Intervalo selector */
  .intervalo-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--borde);
    border-radius: 12px;
  }

  .intervalo-label { font-size: 12px; color: var(--gris); }

  .intervalo-select {
    background: var(--card);
    border: 1px solid var(--borde);
    color: var(--texto);
    font-size: 13px;
    padding: 4px 10px;
    border-radius: 8px;
    font-family: 'DM Sans', sans-serif;
    outline: none;
    cursor: pointer;
  }

  /* Coords */
  .coords { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

  .coord-caja {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: left;
  }

  .coord-label { font-size: 9px; color: var(--gris); letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
  .coord-valor { font-size: 12px; color: var(--verde); font-weight: 600; }

  /* Contador envíos */
  .stats-row { display: flex; gap: 8px; }

  .stat-caja {
    flex: 1;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--borde);
    border-radius: 10px;
    padding: 8px 10px;
    text-align: center;
  }

  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 24px; color: var(--verde); line-height: 1; }
  .stat-label { font-size: 9px; color: var(--gris); letter-spacing: 1px; text-transform: uppercase; margin-top: 2px; }

  /* Aviso pantalla */
  .aviso-pantalla {
    margin-top: 14px;
    padding: 10px 12px;
    background: rgba(255,214,0,0.05);
    border: 1px solid rgba(255,214,0,0.15);
    border-radius: 10px;
    font-size: 11px;
    color: rgba(255,214,0,0.7);
    line-height: 1.5;
    text-align: left;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 28px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--verde);
    color: #000;
    font-weight: 600;
    font-size: 13px;
    padding: 10px 22px;
    border-radius: 50px;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    white-space: nowrap;
    z-index: 100;
  }

  .toast.visible { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--rojo); color: #fff; }
</style>
</head>
<body>

<div class="unidad-selector">
  <button class="btn-unidad activo" onclick="seleccionarUnidad(1, this)">🚌 Unidad 1</button>
  <button class="btn-unidad" onclick="seleccionarUnidad(2, this)">🚌 Unidad 2</button>
</div>

<div class="tarjeta">
  <div class="titulo">GPS CHOFER</div>
  <div class="subtitulo" id="subtitulo">UNIDAD 1 · EN RUTA</div>

  <!-- Banner estado -->
  <div class="banner-rastreo" id="banner">
    <div class="banner-dot"></div>
    <span id="bannerTexto">Rastreo detenido</span>
  </div>

  <!-- Botón principal -->
  <button class="btn-gps" id="btnGps" onclick="toggleRastreo()">
    <span class="icono-gps">📍</span>
    <span class="btn-label" id="btnLabel">INICIAR</span>
  </button>

  <!-- Intervalo -->
  <div class="intervalo-row">
    <span class="intervalo-label">Enviar cada:</span>
    <select class="intervalo-select" id="intervalo">
      <option value="15000">15 segundos</option>
      <option value="30000" selected>30 segundos</option>
      <option value="60000">1 minuto</option>
      <option value="120000">2 minutos</option>
    </select>
  </div>

  <!-- Coords -->
  <div class="coords">
    <div class="coord-caja">
      <div class="coord-label">Latitud</div>
      <div class="coord-valor" id="lat">—</div>
    </div>
    <div class="coord-caja">
      <div class="coord-label">Longitud</div>
      <div class="coord-valor" id="lng">—</div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-caja">
      <div class="stat-num" id="cntEnvios">0</div>
      <div class="stat-label">Envíos</div>
    </div>
    <div class="stat-caja">
      <div class="stat-num" id="cntErrores">0</div>
      <div class="stat-label">Errores</div>
    </div>
    <div class="stat-caja">
      <div class="stat-num" id="ultimaHora">—</div>
      <div class="stat-label">Último</div>
    </div>
  </div>

  <!-- Aviso pantalla apagada -->
  <div class="aviso-pantalla" id="avisoWake">
    💡 Para mantener el rastreo con pantalla apagada: al iniciar el rastreo, presiona el botón de <strong>bloqueo de pantalla activa</strong> que aparecerá arriba.
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHKnO-UMZ9GywKojn4t70AMRmvARQnzeXHnjKxJPGEmU9xZeQ6lUxYN9kuDYQjGr_uyQ/exec";

  let unidadActual = 1;
  let rastreando = false;
  let intervaloId = null;
  let watchId = null;
  let cntEnvios = 0, cntErrores = 0;
  let wakeLock = null;

  // Registrar Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      console.log('SW registrado');
    }).catch(e => console.log('SW error:', e));
  }

  function seleccionarUnidad(num, btn) {
    if (rastreando) { mostrarToast('⚠️ Detén el rastreo primero', true); return; }
    unidadActual = num;
    document.querySelectorAll('.btn-unidad').forEach(b => b.classList.remove('activo'));
    btn.classList.add('activo');
    document.getElementById('subtitulo').textContent = `UNIDAD ${num} · EN RUTA`;
  }

  async function solicitarWakeLock() {
    if ('wakeLock' in navigator) {
      try {
        wakeLock = await navigator.wakeLock.request('screen');
        mostrarToast('🔆 Pantalla bloqueada activa');
        wakeLock.addEventListener('release', () => {
          // Re-adquirir si sigue rastreando
          if (rastreando) setTimeout(solicitarWakeLock, 1000);
        });
      } catch(e) {
        console.log('WakeLock no disponible:', e);
      }
    }
  }

  function liberarWakeLock() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }

  async function toggleRastreo() {
    if (!rastreando) {
      await iniciarRastreo();
    } else {
      detenerRastreo();
    }
  }

  async function iniciarRastreo() {
    if (!navigator.geolocation) {
      mostrarToast('❌ GPS no disponible', true);
      return;
    }

    rastreando = true;
    const btn = document.getElementById('btnGps');
    btn.classList.add('activo');
    document.getElementById('btnLabel').textContent = 'DETENER';
    setBanner('activo', '🟢 Rastreo activo en segundo plano');
    document.getElementById('avisoWake').style.display = 'none';

    // Pedir Wake Lock para mantener pantalla (o al menos evitar que el SO duerma JS)
    await solicitarWakeLock();

    // Enviar inmediatamente
    enviarUbicacion();

    // Configurar intervalo
    const ms = parseInt(document.getElementById('intervalo').value);
    intervaloId = setInterval(enviarUbicacion, ms);

    // También usar watchPosition como respaldo continuo
    watchId = navigator.geolocation.watchPosition(
      pos => {
        document.getElementById('lat').textContent = pos.coords.latitude.toFixed(5);
        document.getElementById('lng').textContent = pos.coords.longitude.toFixed(5);
      },
      err => console.log('Watch error:', err),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 }
    );

    mostrarToast('✅ Rastreo iniciado');
  }

  function detenerRastreo() {
    rastreando = false;
    clearInterval(intervaloId);
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    liberarWakeLock();

    const btn = document.getElementById('btnGps');
    btn.classList.remove('activo');
    document.getElementById('btnLabel').textContent = 'INICIAR';
    setBanner('', 'Rastreo detenido');
    document.getElementById('avisoWake').style.display = 'block';
    mostrarToast('⏹ Rastreo detenido');
  }

  function enviarUbicacion() {
    navigator.geolocation.getCurrentPosition(
      async pos => {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);

        document.getElementById('lat').textContent = lat;
        document.getElementById('lng').textContent = lng;

        try {
          const url = `${SCRIPT_URL}?unidad=${unidadActual}&lat=${lat}&lng=${lng}`;
          await fetch(url, { mode: 'no-cors' });

          cntEnvios++;
          document.getElementById('cntEnvios').textContent = cntEnvios;
          document.getElementById('ultimaHora').textContent =
            new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

          setBanner('activo', `🟢 Enviando · Unidad ${unidadActual}`);
        } catch(e) {
          cntErrores++;
          document.getElementById('cntErrores').textContent = cntErrores;
          setBanner('error', '🔴 Error de conexión');
        }
      },
      err => {
        cntErrores++;
        document.getElementById('cntErrores').textContent = cntErrores;
        setBanner('error', '🔴 Sin señal GPS');
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 10000 }
    );
  }

  function setBanner(tipo, texto) {
    const b = document.getElementById('banner');
    b.className = 'banner-rastreo' + (tipo ? ` ${tipo}` : '');
    document.getElementById('bannerTexto').textContent = texto;
  }

  // Re-adquirir WakeLock cuando la página vuelve a ser visible
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState === 'visible' && rastreando && !wakeLock) {
      await solicitarWakeLock();
    }
  });

  function mostrarToast(msg, esError = false) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast' + (esError ? ' error' : '') + ' visible';
    setTimeout(() => t.classList.remove('visible'), 2800);
  }
</script>
</body>
</html>
